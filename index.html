<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asteria Labels</title>
<style>
:root{--bg:#f3f5f6;--surface:#ffffff;--ink:#132026;--muted:#5b6b73;--line:#d6dde1;--accent:#0d6b73;--accent-soft:#dcefef;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0f1719;--surface:#172226;--ink:#e6eef0;--muted:#97a8ae;--line:#2b3a3f;--accent:#4fb8bf;--accent-soft:#163a3d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:grid;gap:16px}
h1{font-size:26px;margin:0}
p{margin:0;color:var(--muted)}
a.choice{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px 20px;text-decoration:none;color:var(--ink);min-height:110px}
a.choice:hover,a.choice:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:0}
a.choice b{display:block;font-size:22px;color:var(--ink)}
a.choice span{color:var(--muted);font-size:15px}
a.choice i{font-style:normal;font-size:30px;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Asteria Labels</h1>
  <p>What are you labeling?</p>
  <a class="choice" href="retain.html"><span><b>Retain Labels</b><span>Avery 5160 sheets or 2 × 1 in rolls</span></span><i>›</i></a>
  <a class="choice" href="bin.html"><span><b id="binName">Bin Labels</b><span>4 × 2 in rolls with lot, box count, status and total</span></span><i>›</i></a>
</div>
</body>
</html>
